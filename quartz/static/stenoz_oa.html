<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Алгоритм — симптомный стеноз основной артерии</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0f172a; color:#e2e8f0; font-family:system-ui; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header { padding:16px 24px; text-align:center; }
  header h1 { font-size:1.3rem; color:#e2e8f0; }
  .toolbar { position:sticky; top:0; z-index:10; background:#1e293b; border-bottom:1px solid #334155; width:100%; display:flex; justify-content:center; gap:8px; padding:10px; }
  .toolbar button { width:44px; height:44px; border-radius:8px; border:1px solid #475569; background:#334155; color:#e2e8f0; font-size:1.5rem; cursor:pointer; transition:background .15s; }
  .toolbar button:hover { background:#475569; }
  .toolbar .zoom-label { display:flex; align-items:center; font-size:0.9rem; color:#94a3b8; min-width:50px; justify-content:center; }
  .diagram { flex:1; display:flex; justify-content:center; align-items:flex-start; padding:20px; overflow:auto; width:100%; }
  .diagram svg { transition:transform .2s; transform-origin:top center; }
  footer { padding:12px; font-size:0.8rem; color:#64748b; text-align:center; }
  .legend { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; padding:8px 0; }
  .legend span { display:flex; align-items:center; gap:4px; font-size:0.75rem; }
  .legend .dot { width:12px; height:12px; border-radius:3px; }
</style>
</head>
<body>
<div class="toolbar">
  <button onclick="zoom(-0.1)" title="Уменьшить">−</button>
  <span class="zoom-label" id="zoomLabel">100%</span>
  <button onclick="zoom(+0.1)" title="Увеличить">+</button>
  <button onclick="zoomReset()" title="Сброс">↺</button>
</div>

<div class="diagram">
<svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 980" width="620" height="980">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- ============ ROW 1: START ============ -->
  <rect x="180" y="10" width="260" height="52" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="2.5"/>
  <text x="310" y="41" fill="#e2e8f0" font-size="12" text-anchor="middle" dominant-baseline="middle">🏥 Симптомный стеноз ОА</text>

  <!-- start → BAO -->
  <line x1="310" y1="62" x2="310" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 2: BAO? diamond ============ -->
  <polygon points="310,130 430,205 310,280 190,205" fill="#7f1d1d" stroke="#dc2626" stroke-width="2.5"/>
  <text x="310" y="199" fill="#fca5a5" font-size="13" text-anchor="middle" dominant-baseline="middle">🔴 BAO?</text>

  <!-- BAO → MT+stent (left) -->
  <line x1="215" y1="248" x2="95" y2="338" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="125" y="276" fill="#fca5a5" font-size="10" text-anchor="middle" font-weight="bold">ICAS</text>

  <!-- BAO → MT only (right) -->
  <line x1="405" y1="248" x2="525" y2="338" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>
  <text x="485" y="276" fill="#fca5a5" font-size="10" text-anchor="middle" font-weight="bold">не-ICAS</text>

  <!-- BAO → ≤21 (down) -->
  <line x1="310" y1="280" x2="310" y2="350" stroke="#ea580c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="332" y="316" fill="#fdba74" font-size="10" text-anchor="start" font-weight="bold">НЕТ</text>

  <!-- ============ ROW 3: actions BAO + ≤21? diamond ============ -->

  <!-- MT + stent box -->
  <rect x="10" y="340" width="170" height="60" rx="8" fill="#991b1b" stroke="#dc2626" stroke-width="2"/>
  <text x="95" y="363" fill="#fca5a5" font-size="11" text-anchor="middle">МТ + стент (DES)</text>
  <text x="95" y="380" fill="#fca5a5" font-size="9" text-anchor="middle">(NOGA)</text>

  <!-- MT only box -->
  <rect x="440" y="340" width="170" height="60" rx="8" fill="#991b1b" stroke="#dc2626" stroke-width="2"/>
  <text x="525" y="363" fill="#fca5a5" font-size="11" text-anchor="middle">Только МТ</text>
  <text x="525" y="380" fill="#fca5a5" font-size="9" text-anchor="middle">❌ не стентировать</text>

  <!-- ≤21? diamond (bigger, with clear labels) -->
  <polygon points="310,352 440,432 310,512 180,432" fill="#7c2d12" stroke="#ea580c" stroke-width="2.5"/>
  <text x="310" y="422" fill="#fdba74" font-size="13" text-anchor="middle" dominant-baseline="middle">⏱ ≤21 дня?</text>
  <text x="310" y="444" fill="#fdba74" font-size="9" text-anchor="middle" dominant-baseline="middle">от индексного события</text>

  <!-- ≤21 → Стабилен (left) -->
  <line x1="215" y1="475" x2="120" y2="565" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="130" y="508" fill="#93c5fd" font-size="10" text-anchor="start" font-weight="bold">Стабилен</text>

  <!-- ≤21 → Кресчендо (right) -->
  <line x1="405" y1="475" x2="500" y2="565" stroke="#f97316" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="478" y="508" fill="#fdba74" font-size="10" text-anchor="end" font-weight="bold">Кресчендо</text>

  <!-- ≤21 → >21 дня (down) — ВЫНЕСЕНА ВЛЕВО, ЧТОБЫ НЕ ПЕРЕКРЫВАТЬ -->
  <line x1="310" y1="512" x2="310" y2="588" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="332" y="548" fill="#86efac" font-size="10" text-anchor="start" font-weight="bold">&gt;21 дня</text>

  <!-- ============ ROW 4: actions ≤21 + Med.failure diamond ============ -->

  <!-- АМТ box -->
  <rect x="10" y="568" width="220" height="78" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="120" y="592" fill="#93c5fd" font-size="11" text-anchor="middle">💊 Агрессивная АМТ</text>
  <text x="120" y="610" fill="#93c5fd" font-size="9" text-anchor="middle">ДААТ × 90 д. + статины</text>
  <text x="120" y="626" fill="#93c5fd" font-size="9" text-anchor="middle">допустимая гипертензия</text>

  <!-- Кресчендо box -->
  <rect x="390" y="568" width="220" height="78" rx="8" fill="#c2410c" stroke="#f97316" stroke-width="2"/>
  <text x="500" y="592" fill="#fdba74" font-size="11" text-anchor="middle">⚡ Кресчендо-ТИА</text>
  <text x="500" y="610" fill="#fdba74" font-size="9" text-anchor="middle">→ консилиум</text>
  <text x="500" y="626" fill="#fdba74" font-size="9" text-anchor="middle">→ щадящая ангиопластика</text>

  <!-- Med.failure? diamond -->
  <polygon points="310,590 440,670 310,750 180,670" fill="#14532d" stroke="#16a34a" stroke-width="2.5"/>
  <text x="310" y="662" fill="#86efac" font-size="11" text-anchor="middle" dominant-baseline="middle">🔄 Med.failure?</text>
  <text x="310" y="680" fill="#86efac" font-size="9" text-anchor="middle" dominant-baseline="middle">(рецидивы на АМТ)</text>

  <!-- Med.failure → DCB (left) -->
  <line x1="215" y1="713" x2="120" y2="803" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="130" y="748" fill="#86efac" font-size="10" text-anchor="start" font-weight="bold">ДА</text>

  <!-- Med.failure → Conservative (right) -->
  <line x1="405" y1="713" x2="500" y2="803" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="478" y="748" fill="#93c5fd" font-size="10" text-anchor="end" font-weight="bold">НЕТ</text>

  <!-- ============ ROW 5: final actions ============ -->

  <!-- DCB box -->
  <rect x="10" y="805" width="220" height="78" rx="8" fill="#166534" stroke="#22c55e" stroke-width="2"/>
  <text x="120" y="829" fill="#86efac" font-size="11" text-anchor="middle">🎈 Ангиопластика DCB</text>
  <text x="120" y="847" fill="#86efac" font-size="9" text-anchor="middle">50–70% диаметра сосуда</text>
  <text x="120" y="863" fill="#86efac" font-size="9" text-anchor="middle">стент — только rescue</text>

  <!-- Conservative box -->
  <rect x="390" y="805" width="220" height="78" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="500" y="829" fill="#93c5fd" font-size="11" text-anchor="middle">💊 Консервативно</text>
  <text x="500" y="847" fill="#93c5fd" font-size="9" text-anchor="middle">продолжить терапию</text>
  <text x="500" y="863" fill="#93c5fd" font-size="9" text-anchor="middle">вмешательство не показано</text>
</svg>
</div>

<footer>
  <div class="legend">
    <span><span class="dot" style="background:#dc2626"></span> BAO / экстренно</span>
    <span><span class="dot" style="background:#ea580c"></span> Тайминг</span>
    <span><span class="dot" style="background:#22c55e"></span> Плановое вмешательство</span>
    <span><span class="dot" style="background:#3b82f6"></span> Консервативно</span>
  </div>
  <div style="margin-top:8px">Колёсико мыши + Ctrl — зум • Перетаскивание — навигация • 2026</div>
</footer>

<script>
let scale = 1;
const svg = document.getElementById('diagram');
const label = document.getElementById('zoomLabel');
function zoom(delta) { scale=Math.round((scale+delta)*10)/10; if(scale<0.2)scale=0.2; if(scale>3)scale=3; applyZoom(); }
function zoomReset() { scale=1; applyZoom(); }
function applyZoom() { svg.style.transform=`scale(${scale})`; label.textContent=Math.round(scale*100)+'%'; }
document.querySelector('.diagram').addEventListener('wheel', e => { if(e.ctrlKey){ e.preventDefault(); zoom(e.deltaY<0?0.1:-0.1); }});
</script>
</body>
</html>
